<svg width="100%" height="100%" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Definición de los degradados -->
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c15bb; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5c26ca; stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c15bb; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5c26ca; stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c15bb; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5c26ca; stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c15bb; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5c26ca; stop-opacity:1" />
    </linearGradient>
    
    <pattern id="gradient-pattern" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect x="10" y="0" width="28" height="28" fill="url(#gradient1)" rx="8" ry="8" />
      <rect x="50" y="10" width="20" height="20" fill="url(#gradient2)" rx="8" ry="8" />
      <rect x="30" y="50" width="15" height="15" fill="url(#gradient3)" rx="5" ry="5" />
      <rect x="70" y="60" width="10" height="10" fill="url(#gradient4)" rx="5" ry="5" />
      <rect x="20" y="70" width="45" height="20" fill="url(#gradient2)" rx="8" ry="8" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#gradient-pattern)" />
</svg>
